.button-list{display:flex;flex-direction:column;gap:13px;width:100%}
.link{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;
  padding:15px 13px;border:1px solid rgba(255,255,255,.24);border-radius:14px;
  color:#fff;text-align:center;text-decoration:none;font-size:15px;line-height:1.35;
  font-weight:850;letter-spacing:.35px;box-shadow:0 5px 15px rgba(0,0,0,.28);
  transition:filter .15s ease,transform .15s ease;-webkit-tap-highlight-color:transparent
}
.link:hover{filter:brightness(1.12)}.link:active{transform:scale(.985)}
.link:focus-visible{outline:3px solid #fff;outline-offset:3px}
.video-button{background:linear-gradient(135deg,#ed3038,#a80f19)}
.full-video-button{background:linear-gradient(135deg,#7545d6,#3e1a87)}
.group-button{background:linear-gradient(135deg,#19a568,#075d3a)}
.footer{margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.82);font-size:12px;line-height:1.6;text-align:center}
/* Phone layout */
@media(max-width:600px){
  body{padding:18px 16px;}
  body::before{background-position:center center;}
  .container{max-width:420px;}
  .post{padding:24px 17px 18px;border-radius:20px;background:rgba(7,9,14,.82);}
  .title{font-size:27px;}
  .subtitle{font-size:14px;margin-bottom:20px;}
  .button-list{gap:12px;}
  .link{min-height:57px;font-size:15px;border-radius:13px;}
}
@media(max-width:380px){
  body{padding:14px 12px;}
  .post{padding:21px 14px 16px;}
  .title{font-size:25px;}
  .link{min-height:54px;font-size:14px;}
  .footer{font-size:11px;}
}
@media(max-height:650px){
  body{align-items:flex-start;padding-top:18px;padding-bottom:18px;}
}
@media(prefers-reduced-motion:reduce){.link{transition:none}}
